name: Build Termkes Packages

on:
  push:
    paths:
      - 'packages.yml'
      - '.github/workflows/build-php-libsodium.yml'
  workflow_dispatch:
    inputs:
      libsodium_version:
        description: "libsodium version"
        required: true
        default: "1.0.22"
      libsodium_url:
        description: "libsodium tar.gz URL"
        required: true
        default: "https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22.tar.gz"
      php_version:
        description: "PHP version"
        required: true
        default: "8.5.12"
      php_url:
        description: "PHP tar.gz URL"
        required: true
        default: "https://www.php.net/distributions/php-8.5.12.tar.gz"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - target_arch: aarch64
            ndk_triple: aarch64-linux-android
            api_level: 24
          - target_arch: arm
            ndk_triple: armv7a-linux-androideabi
            api_level: 24
          - target_arch: x86_64
            ndk_triple: x86_64-linux-android
            api_level: 24
          - target_arch: i686
            ndk_triple: i686-linux-android
            api_level: 24
      fail-fast: false

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Compile and Package libsodium
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PREFIX: /data/data/com.termux/files/usr
          ARCH: ${{ matrix.target_arch }}
          NDK_TRIPLE: ${{ matrix.ndk_triple }}
          API_LEVEL: ${{ matrix.api_level }}
          VERSION: ${{ github.event.inputs.libsodium_version || '1.0.22' }}
          URL: ${{ github.event.inputs.libsodium_url || 'https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22.tar.gz' }}
        run: |
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export CC="$TOOLCHAIN/bin/${NDK_TRIPLE}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${NDK_TRIPLE}${API_LEVEL}-clang++"
          export LD="$TOOLCHAIN/bin/ld"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          mkdir -p src_cache && cd src_cache
          wget -q "$URL" -O libsodium.tar.gz
          tar -xzf libsodium.tar.gz
          cd libsodium-*

          ./configure \
            --host=${NDK_TRIPLE} \
            --prefix=$PREFIX \
            --disable-soname-versions \
            --enable-shared \
            --disable-static

          make -j$(nproc)
          
          mkdir -p /tmp/libsodium_pkg/DEBIAN
          make DESTDIR=/tmp/libsodium_pkg install
          $STRIP /tmp/libsodium_pkg$PREFIX/lib/*.so || true

          INSTALLED_SIZE=$(du -sk /tmp/libsodium_pkg | cut -f1)
          cat <<EOF > /tmp/libsodium_pkg/DEBIAN/control
          Package: libsodium
          
